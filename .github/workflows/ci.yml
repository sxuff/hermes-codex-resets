name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required: the plugin parses, imports only what the desktop loader resolves,
  # and stays clear of what the catalog's desktop lint refuses.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-plugin.mjs

  # Advisory: the pinned Hermes validator (manifest, security scan, desktop
  # surface). It needs a hermes-agent checkout, so it reports but does not
  # block a merge.
  hermes-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Hermes validator
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          git -C /tmp/hermes-agent fetch --depth=1 origin 49c6d4a9e0dddc64d6333c5b1fcc9d911463a8fd
          git -C /tmp/hermes-agent checkout --detach 49c6d4a9e0dddc64d6333c5b1fcc9d911463a8fd
          python -m pip install -e /tmp/hermes-agent
      - run: hermes plugins validate .
