      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const $ = s => document.querySelector(s);

          // Camera (viewport-change): one #world, T = -offset × S. Shots anchor to the window's
          // bottom-right corner so the frame never shows past its edge: x = 960 - 960S, y = 540 - 540S.
          const world = $("#world");
          const cam = { scale: 1, x: 0, y: 0 };
          const applyCamera = () => { world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`; };
          const cornerShot = s => ({ scale: s, x: 960 - 960 * s, y: 540 - 540 * s });
          applyCamera();
          tl.fromTo(cam, { scale: 1, x: 0, y: 0 }, { ...cornerShot(1.6), duration: 1.4, ease: "power3.inOut", onUpdate: applyCamera }, 1.2);
          // Slow drift while the cards hold, still anchored to the corner so no edge shows.
          tl.to(cam, { ...cornerShot(1.64), duration: 5.3, ease: "sine.inOut", onUpdate: applyCamera, immediateRender: false }, 4.6);
          // Typing shot: frame the composer's left edge and the chip, with the top just below the conversation.
          tl.to(cam, { scale: 1.45, x: -224, y: 540 - 540 * 1.45, duration: 1.0, ease: "power3.inOut", onUpdate: applyCamera, immediateRender: false }, 10.0);

          // Focus ring on the chip before the first reset.
          tl.set("#w-ring", { opacity: 0 }, 0);
          tl.fromTo("#w-ring", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 2.75);
          tl.to("#w-ring", { scale: 1.12, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 3.1);
          tl.to("#w-ring", { opacity: 0, duration: 0.15 }, 3.85);
          tl.fromTo("#w-tool", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.6);

          // Chip states: opacity toggles are seek-safe.
          const chips = ["#w-chip-idle", "#w-chip-fresh", "#w-chip-banked", "#w-chip-pulse"];
          const showChip = (sel, t) => chips.forEach(c => tl.set(c, { opacity: c === sel ? 1 : 0 }, t));
          showChip("#w-chip-idle", 0);
          showChip("#w-chip-fresh", 3.9);
          showChip("#w-chip-banked", 7.4);
          showChip("#w-chip-idle", 10.0);

          // A reset lands: the card rises out of the chip, the wing flares, the flood rises, the letters stand up.
          const reset = (id, t0, hold) => {
            const c = `#w-card-${id}`;
            tl.set(c, { opacity: 0, scale: 0.88, y: 18 }, 0);
            tl.set([`#w-flare-${id}`, `#w-q-${id}`, `#w-frow-${id}`], { opacity: 0 }, 0);
            tl.set(`#w-flood-${id}`, { clipPath: "inset(100% 0% 0% 0%)" }, 0);
            tl.set(`#w-word-${id} span`, { scaleY: 0 }, 0);
            tl.to(c, { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "back.out(1.4)" }, t0);
            tl.to(`#w-flare-${id}`, { opacity: 1, duration: 0.8, ease: "power2.out" }, t0 + 0.05);
            tl.to(`#w-q-${id}`, { opacity: 1, duration: 0.35, ease: "power1.out" }, t0 + 0.45);
            tl.to(`#w-flood-${id}`, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power4.inOut" }, t0 + 0.3);
            tl.to(`#w-word-${id} span`, { scaleY: 1, duration: 0.5, ease: "expo.out", stagger: 0.06 }, t0 + 0.6);
            tl.to(`#w-frow-${id}`, { opacity: 1, duration: 0.3 }, t0 + 0.85);
            tl.to(c, { opacity: 0, scale: 0.9, y: 14, duration: 0.3, ease: "power2.in" }, t0 + hold);
          };
          reset("a", 3.9, 3.0);
          reset("b", 7.4, 2.3);

          // Typing: only the chip reacts.
          const text = "Also batch the shadow pass so it";
          const typed = $("#w-typed"), ph = $("#w-ph");
          const typing = { n: 0 };
          tl.fromTo(typing, { n: 0 }, {
            n: text.length, duration: 1.2, ease: "none",
            onUpdate: () => { const k = Math.round(typing.n); typed.textContent = text.slice(0, k); ph.style.display = k ? "none" : "inline"; }
          }, 10.55);
          tl.fromTo("#w-caret", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "steps(1)", repeat: 3, yoyo: true }, 11.8);
          showChip("#w-chip-pulse", 11.75);
          tl.fromTo("#w-sweep", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 11.75);
          tl.fromTo("#w-chip-pulse", { color: "#a39a93" }, { color: "#0000f2", duration: 0.2 }, 11.95);

          window.__timelines["world-scene"] = tl;
        })();
      </script>
