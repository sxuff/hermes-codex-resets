<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0f0c0b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0f0c0b; }
      .wipe { position: absolute; inset: 0; }
      .wipe i { position: absolute; inset: 0; display: block; }
      #wipe-y i { background: #f2f200; }
      #wipe-b i { background: #0000f2; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-i7xc" id="root" data-composition-id="main" data-start="0" data-duration="19" data-width="1920" data-height="1080">
      <!-- The Hermes window: quiet chip, a reset, a banked reset, typing. -->
      <div data-hf-id="hf-dlgy" id="world-scene" data-composition-id="world-scene" data-composition-src="compositions/world.html" data-start="0" data-duration="13.25" data-track-index="0" data-width="1920" data-height="1080"></div>
      <!-- History of every reset. -->
      <div data-hf-id="hf-am16" id="history" data-composition-id="history" data-composition-src="compositions/history.html" data-start="13.25" data-duration="2.9" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- End card: name, install line, data credit. -->
      <div data-hf-id="hf-3avq" id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="16.15" data-duration="2.85" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- Wipes between scenes echo the flood: yellow into history, blue into the end card. -->
      <div data-hf-id="hf-himp" id="wipe-y" class="wipe clip" data-start="12.9" data-duration="0.8" data-track-index="3"><i data-hf-id="hf-tyfa" id="wipe-y-bar"></i></div>
      <div data-hf-id="hf-6k07" id="wipe-b" class="wipe clip" data-start="15.8" data-duration="0.8" data-track-index="4"><i data-hf-id="hf-akn1" id="wipe-b-bar"></i></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const wipe = (sel, t) => {
        tl.fromTo(sel, { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.34, ease: "power3.in" }, t);
        tl.to(sel, { clipPath: "inset(0% 0% 100% 0%)", duration: 0.36, ease: "power3.out" }, t + 0.36);
      };
      wipe("#wipe-y-bar", 12.9);
      wipe("#wipe-b-bar", 15.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
